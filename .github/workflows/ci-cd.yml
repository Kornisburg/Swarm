name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: the_hive
          POSTGRES_USER: hive_user
          POSTGRES_PASSWORD: hive_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hive_user -d the_hive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: the_hive
      POSTGRES_USER: hive_user
      POSTGRES_PASSWORD: hive_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Import smoke test
        run: python -c "import infra.fastapi_gateway.app as app; print(app.app.title)"

      - name: Deterministic unit tests
        run: python -m pytest -q -o addopts="" tests/unit/test_orchestrator/test_state.py

      - name: Generate coverage report for deterministic unit slice
        run: python -m pytest -q -o addopts="" tests/unit/test_orchestrator/test_state.py --cov=core.orchestrator.state --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy production placeholder
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Document deployment hook
        run: |
          echo "Replace this step with your platform deploy command."
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
