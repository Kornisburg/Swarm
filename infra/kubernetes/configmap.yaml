apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-config
  namespace: hive
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  LLM_PROVIDER: "vertexai"
  MODEL_TEMPERATURE: "0.7"
  MAX_TOKENS: "4096"

  POSTGRES_HOST: "10.96.0.3"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "the_hive"
  POSTGRES_USER: "hive_user"

  REDIS_HOST: "10.96.12.115"
  REDIS_PORT: "6379"

  VECTOR_STORE_TYPE: "chroma"
  CHROMA_HOST: "chroma-service.hive.svc.cluster.local"
  CHROMA_PORT: "8000"
  CHROMA_PERSIST_DIR: "/data/chroma"

  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "hive-dev"

  SANDBOX_TYPE: "docker"
  DOCKER_NETWORK: "none"

  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
