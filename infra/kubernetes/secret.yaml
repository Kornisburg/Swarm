apiVersion: v1
kind: Secret
metadata:
  name: hive-secrets
  namespace: hive
type: Opaque
stringData:
  postgres-password: ""      # Replace or use kubectl create secret
  openai-api-key: ""         # Export OPENAI_API_KEY before deploy
  anthropic-api-key: ""      # Export ANTHROPIC_API_KEY before deploy
  langchain-api-key: ""      # Export LANGCHAIN_API_KEY before deploy
